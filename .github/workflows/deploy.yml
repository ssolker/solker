# Build and deploy to GitHub Pages (runs in Actions; no branch build).
# Repo Settings → Pages: set "Build and deployment" → "GitHub Actions".

name: CI

# Controls when the workflow will run
on:
  # Build and deploy on push to main
  push:
    branches: [main]
  # Build only (no deploy) on pull requests targeting main
  pull_request:
    branches: [main]
  # Run manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build the site and upload artifact for deployment
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload with Astro
        uses: withastro/action@v3
        env:
          PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.PUBLIC_RECAPTCHA_SITE_KEY }}
          PUBLIC_FORMS_API_URL: ${{ vars.PUBLIC_FORMS_API_URL }}

  # Deploy to GitHub Pages (only on push to main, not on pull_request)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
